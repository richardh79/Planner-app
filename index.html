<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBFAF8">
<meta name="mobile-web-app-capable" content="yes">
<title>Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Built on what the best planner interfaces do: the content is the interface.
   Paper ground, one accent, hairlines instead of filled boxes, and space doing
   the work that borders used to. Colour marks meaning only: a dot for a domain,
   the accent for the one number that matters. */
:root{
  --bg:#FBFAF8; --raise:#FFFFFF; --sink:#F1EFEA;
  --ink:#14161A; --ink2:#5A6170; --dim:#8A909D; --hair:rgba(20,22,26,.10);
  --accent:#2F6BFF;
  --research:#2F6BFF; --patents:#7B4BD8; --teaching:#0E9C8A; --products:#E2731B;
  --people:#D93F73; --certs:#B98600; --conf:#5C6A80; --money:#12935A;
  --c1:#0E9C8A; --c2:#2A82C4; --c3:#4A5FCE; --neutral:#8A909D;
  --hot:#E2731B; --bad:#D53F3F; --good:#12935A;
  --nav:76px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1013; --raise:#191B20; --sink:#15171C;
    --ink:#F2F3F6; --ink2:#A4ABB8; --dim:#767D8B; --hair:rgba(242,243,246,.12);
    --accent:#6E9CFF;
    --research:#6E9CFF; --patents:#A98AF0; --teaching:#2ABFA9; --products:#FF9445;
    --people:#F0709E; --certs:#E0B23F; --conf:#93A0B5; --money:#3CCA84;
    --c1:#2ABFA9; --c2:#5FAFE8; --c3:#8496F0; --neutral:#767D8B;
    --hot:#FF9445; --bad:#FF6B6B; --good:#3CCA84;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1013; --raise:#191B20; --sink:#15171C;
  --ink:#F2F3F6; --ink2:#A4ABB8; --dim:#767D8B; --hair:rgba(242,243,246,.12);
  --accent:#6E9CFF;
  --research:#6E9CFF; --patents:#A98AF0; --teaching:#2ABFA9; --products:#FF9445;
  --people:#F0709E; --certs:#E0B23F; --conf:#93A0B5; --money:#3CCA84;
  --c1:#2ABFA9; --c2:#5FAFE8; --c3:#8496F0; --neutral:#767D8B;
  --hot:#FF9445; --bad:#FF6B6B; --good:#3CCA84;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden;max-width:100%}
body{
  margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:17px;line-height:1.5;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer;text-align:left;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:33rem;margin:0 auto;padding-inline:20px}
.any{overflow-wrap:anywhere;word-break:break-word}
.tag{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--dim)}
.num{font-variant-numeric:tabular-nums}

/* header: quiet, the page title is the only heavy thing */
header{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top)}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 6px}
.hbar h1{margin:0;font-size:2.15rem;font-weight:700;letter-spacing:-.035em}
.hbar .right{display:flex;align-items:center;gap:6px}
.hbar .clk{font-size:.8rem;font-weight:600;color:var(--dim);margin-right:6px}
.icobtn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:1.05rem;color:var(--dim);flex:none}
.icobtn:active{background:var(--sink)}

/* the block: no fill, no border. space and a hairline. */
.band{--a:var(--neutral);display:block;width:100%;padding:18px 0;margin:0;
  border-bottom:1px solid var(--hair);background:none}
.band:last-child{border-bottom:none}
.band.flat{border-bottom:1px solid var(--hair)}
.band .kicker{display:block;color:var(--dim);margin-bottom:10px}

/* hero */
.hero{padding-top:8px}
.hero .big{display:block;font-size:2.3rem;line-height:1.06;font-weight:700;letter-spacing:-.035em}
.hero .say{display:block;margin-top:10px;font-size:1.02rem;color:var(--ink2);line-height:1.45}
.hero .clockrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:20px}
.hero .lft{flex:none}
.hero .lv{display:block;font-size:2.7rem;font-weight:700;letter-spacing:-.045em;line-height:1;color:var(--a)}
.hero .lc{display:block;font-size:.72rem;color:var(--dim);margin-top:6px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.hero .nxt{text-align:right;font-size:.94rem;color:var(--ink2);max-width:58%;line-height:1.4}
.hero .nxt b{display:block;color:var(--dim);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;font-weight:700}

/* running */
.run{display:flex;align-items:center;gap:15px;min-height:66px}
.run .pulse{width:11px;height:11px;border-radius:50%;background:var(--a);flex:none;
  box-shadow:0 0 0 5px color-mix(in srgb, var(--a) 18%, transparent)}
.run.live .pulse{animation:pp 2s ease-in-out infinite}
@keyframes pp{0%,100%{opacity:1}50%{opacity:.3}}
.run .txt{flex:1;min-width:0}
.run .txt b{display:block;font-size:1.05rem;font-weight:600;line-height:1.3}
.run .txt span{font-size:.9rem;color:var(--ink2)}
.pill{flex:none;min-height:40px;padding:0 18px;border-radius:20px;display:flex;align-items:center;
  font-weight:600;font-size:.88rem;background:var(--sink);color:var(--ink)}
.run.live .pill{background:var(--a);color:#fff}

.quote{font-size:1.3rem;line-height:1.42;font-weight:600;letter-spacing:-.02em;margin:0}

/* sections: the header is quiet, the content is loud */
.sec{margin-top:34px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin-bottom:6px;padding-bottom:10px;border-bottom:1px solid var(--hair)}
.sech h2{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--dim)}
.sech span{font-size:.82rem;color:var(--dim)}

/* days */
.days{display:flex;gap:4px;margin:14px 0 6px}
.days button{position:relative;flex:1;min-width:0;height:56px;border-radius:14px;background:none;
  display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:600;color:var(--dim)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.days button.today::after{content:"";position:absolute;bottom:9px;width:5px;height:5px;
  border-radius:50%;background:var(--accent)}
.days button[aria-pressed="true"].today::after{background:var(--bg)}

/* a time block is a row, not a card */
.blk{display:flex;gap:16px;align-items:flex-start;padding:15px 0}
.blk .t{flex:none;width:5.4rem;font-size:.88rem;font-weight:600;color:var(--dim);line-height:1.35;padding-top:1px}
.blk .d{flex:1;min-width:0;border-left:3px solid var(--a);padding-left:14px}
.blk .d b{display:block;font-size:1.04rem;font-weight:600;line-height:1.3}
.blk .d span{display:block;font-size:.92rem;color:var(--ink2);margin-top:3px;line-height:1.4}
.blk.on .d{border-left-width:3px}
.blk.on .d b::after{content:" · now";color:var(--a);font-weight:700}

/* ---- the walk: a thread is a path, a stage is a stone ---- */
.walkblk{text-align:left;width:100%;background:none;border:none;color:inherit;align-items:center}
.walkblk .chip{align-self:center}
.blk.hole .d{border-left-style:dashed}
.blk .d span.holetxt{color:var(--hot);font-weight:600}
.blk .d span.livetxt{color:var(--a);font-weight:600}

.cat{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;
  border:none;border-bottom:1px solid var(--hair);color:inherit;padding:18px 0;min-height:64px}
.cat .catl{flex:1;min-width:0;border-left:3px solid var(--a);padding-left:14px}
.cat .catl b{display:block;font-size:1.1rem;font-weight:600;line-height:1.3}
.cat .catl span{display:block;font-size:.86rem;color:var(--dim);margin-top:2px}
.cat.open .catl b{color:var(--a)}

.path{display:flex;flex-direction:column;margin-top:4px;
  background:linear-gradient(var(--hair),var(--hair)) no-repeat 9px 28px/2px calc(100% - 56px)}
.stone{display:flex;align-items:center;gap:15px;width:100%;min-height:56px;padding:8px 0;
  background:none;border:none;color:inherit;text-align:left}
.stone .bead{flex:none;width:20px;height:20px;border-radius:50%;background:var(--bg);
  box-shadow:inset 0 0 0 2px var(--a)}
.stone .st{flex:1;min-width:0;font-size:1rem;font-weight:500;color:var(--dim);line-height:1.35}
.stone .mk{flex:none;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--a)}
.stone.done .bead{background:var(--a)}
.stone.done .st{color:var(--ink2)}
.stone.here .bead{background:var(--a);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--a)}
.stone.here .st{color:var(--ink);font-weight:700;font-size:1.06rem}
.stone.ahead .bead{box-shadow:inset 0 0 0 2px var(--hair)}
.stone.ahead .st{color:var(--dim);opacity:.8}

.final{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px;border-radius:14px;
  background:var(--sink);border-left:3px solid var(--a)}
.final .fl{flex:1;min-width:0}
.final .fl b{display:block;font-size:1.02rem;font-weight:700;line-height:1.3}
.final .fl .tag{display:block;margin-top:2px}
.final .num{flex:none;font-size:.86rem;color:var(--dim)}
.nextstep{margin:14px 0 0;font-size:.98rem;line-height:1.5;color:var(--ink2)}
.nextstep b{display:block;margin-bottom:2px}

.track{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 0;
  background:none;border:none;border-top:1px solid var(--hair);color:inherit;text-align:left}
.track .nm{flex:1 1 42%;min-width:0;font-size:.98rem;font-weight:600;line-height:1.3}
.track .railpath{flex:1 1 26%;height:5px;border-radius:3px;background:var(--sink);overflow:hidden;min-width:48px}
.track .railpath i{display:block;height:100%;border-radius:3px;background:var(--a)}
.track .dest{flex:none;max-width:38%;font-size:.8rem;font-weight:600;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .dest.at{color:var(--a)}

/* counting beats percentages */
.pips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.pips i{width:16px;height:16px;border-radius:50%;background:var(--a);display:block}
.pips i.off{background:none;box-shadow:inset 0 0 0 2px var(--hair)}

/* one number */
.stat{text-align:left;padding:10px 0 22px}
.stat .v{display:block;font-size:5rem;line-height:.9;font-weight:700;letter-spacing:-.06em;color:var(--a)}
.stat .c{display:block;margin-top:16px;font-size:1rem;color:var(--ink2);line-height:1.5;max-width:26rem}
.splitbar{display:flex;height:8px;border-radius:5px;overflow:hidden;margin-top:22px;background:var(--sink)}
.splitbar i{display:block}
.keys{display:flex;gap:20px;margin-top:12px;font-size:.82rem;color:var(--dim)}
.keys span{display:flex;align-items:center;gap:7px}
.keys b{width:9px;height:9px;border-radius:50%;display:block}

/* rows */
.rows{margin-top:8px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:15px;min-height:56px;padding:8px 0;
  border-top:1px solid var(--hair);width:100%;text-align:left}
.row:first-child{border-top:none}
.row .dot{flex:none;width:11px;height:11px;border-radius:50%;background:var(--a)}
.row .dot.cold{background:none;box-shadow:inset 0 0 0 2px var(--hair)}
.row .nm{flex:1;min-width:0;font-size:1rem;font-weight:500;line-height:1.35}
.row .nm u{display:block;text-decoration:none;font-size:.86rem;color:var(--dim);font-weight:400;margin-top:2px}
.row .val{flex:none;font-size:.88rem;font-weight:600;color:var(--dim)}
.row .val.live{color:var(--a)}

/* a thread */
.thh{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.thh b{font-size:1.12rem;font-weight:600;line-height:1.3;letter-spacing:-.015em}
.chip{flex:none;padding:5px 11px;border-radius:20px;background:var(--sink);color:var(--ink2);
  font-size:.74rem;font-weight:600;letter-spacing:.01em}
.chip.quiet{color:var(--dim)}
.stage{display:flex;gap:4px;margin-top:16px}
.stage i{flex:1;height:4px;border-radius:2px;background:var(--hair)}
.stage i.done{background:var(--a)}
.thf{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:.9rem;color:var(--ink2)}
.thf em{font-style:normal;font-weight:600;color:var(--dim)}
.thb{display:flex;gap:10px;margin-top:18px}
.thb button{flex:1;min-height:46px;border-radius:23px;display:flex;align-items:center;
  justify-content:center;font-weight:600;font-size:.9rem;background:var(--sink);color:var(--ink)}
.thb button.go{background:var(--a);color:#fff}

/* forms */
.fld{margin-top:20px}
.fld label{display:block;margin-bottom:9px}
select,textarea,input[type=password],input[type=text]{
  width:100%;background:var(--raise);border:1px solid var(--hair);border-radius:14px;
  padding:15px 16px;font-size:1rem;line-height:1.5;color:var(--ink)}
select:focus,textarea:focus,input:focus{border-color:var(--accent);outline:none}
textarea{min-height:160px;resize:vertical;overflow-wrap:anywhere}
select{appearance:none}
.microw{display:flex;align-items:center;gap:16px;margin-top:20px}
.rec{flex:none;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:1.4rem;background:var(--sink)}
.rec.on{background:var(--bad);color:#fff;animation:pp 1.2s ease-in-out infinite}
.microw .hint{flex:1;min-width:0;font-size:.88rem;color:var(--ink2);line-height:1.4}
.lang{flex:none;min-height:44px;padding:0 16px;border-radius:22px;background:var(--sink);
  font-weight:600;font-size:.84rem;display:flex;align-items:center}
.wide{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;
  border-radius:27px;text-align:center;font-weight:600;font-size:1rem;
  background:var(--accent);color:#fff;margin-top:22px}
.wide.ghost{background:var(--sink);color:var(--ink)}
.duo{display:flex;gap:10px;margin-top:22px}
.duo .wide{margin-top:0;flex:1}

/* inbox */
.issh{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--dim);font-weight:600}
.iss b{display:block;font-size:1.08rem;font-weight:600;margin-top:8px;line-height:1.35}
.iss p{margin:8px 0 0;font-size:.94rem;color:var(--ink2);line-height:1.5}
.iss .rep{margin-top:12px;font-size:.88rem;color:var(--accent);font-weight:600}

.note{font-size:.88rem;color:var(--dim);line-height:1.55;margin-top:14px}
.note.bad{color:var(--bad)}
.note.ok{color:var(--good)}
.empty{padding:40px 0;text-align:center;color:var(--dim);font-size:1rem;line-height:1.6}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);
  border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:33rem;margin:0 auto;display:flex}
nav button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;color:var(--dim)}
nav button span{font-size:1.25rem;line-height:1}
nav button em{font-style:normal;font-size:.68rem;font-weight:600;letter-spacing:.02em}
nav button[aria-current="page"]{color:var(--accent)}

/* sheet */
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,11,14,.4);
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sh{width:100%;max-width:33rem;background:var(--bg);border-radius:20px 20px 0 0;
  padding:10px 20px calc(26px + env(safe-area-inset-bottom));
  max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh::before{content:"";display:block;width:38px;height:4px;border-radius:2px;
  background:var(--hair);margin:0 auto 16px}
.shh{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:10px}
.shh b{display:block;margin-top:3px;font-size:1.5rem;font-weight:700;line-height:1.2;letter-spacing:-.03em}
.shx{flex:none;width:42px;height:42px;border-radius:50%;background:var(--sink);
  display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--dim)}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <h1 id="ttl">Now</h1>
    <div class="right">
      <span class="clk num" id="clk">—</span>
      <button class="icobtn" id="theme" aria-label="Switch light and dark">◐</button>
      <button class="icobtn" id="gear" aria-label="Settings">⚙</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav>
  <div class="in">
    <button data-v="now" aria-current="page"><span>◉</span><em>NOW</em></button>
    <button data-v="map"><span>◈</span><em>MAP</em></button>
    <button data-v="threads"><span>▤</span><em>WORK</em></button>
    <button data-v="say"><span>🎙</span><em>SAY</em></button>
    <button data-v="inbox"><span>✉</span><em>INBOX</em></button>
  </div>
</nav>

<div id="sheet"></div>
<script src="app.js?v=9"></script>
</body>
</html>
