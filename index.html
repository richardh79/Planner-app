<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090D">
<meta name="mobile-web-app-capable" content="yes">
<title>Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#07090D; --card:#12161E; --card2:#191E28; --sink:#0B0E14;
  --ink:#EEF1F6; --ink2:#B4BCCB; --dim:#7A8496; --faint:#4C5568;
  --edge:rgba(238,241,246,.11); --edge2:rgba(238,241,246,.055);
  --research:#5B96F7; --patents:#A97AEA; --teaching:#2FB4AB; --products:#EC8A3C;
  --people:#E86CA0; --certs:#D9AC3F; --money:#4CB075; --neutral:#6D7789;
  --c1:#2FB4AB; --c2:#4FA7D8; --c3:#6E8FE0; --conf:#8592A6;
  --hot:#EC8A3C; --bad:#E8695C; --nav:72px;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;text-align:left;padding:0}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.wrap{max-width:34rem;margin:0 auto;padding-inline:14px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.lb{font-family:ui-monospace,Menlo,monospace;font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.any{overflow-wrap:anywhere;word-break:break-word}
h1{font-size:1.55rem;font-weight:600;letter-spacing:-.02em;margin:0}
h2{font-size:1.1rem;font-weight:600;margin:0}

header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--edge2);
  padding-top:env(safe-area-inset-top)}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:13px}
.hbar .clk{font-family:ui-monospace,Menlo,monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-variant-numeric:tabular-nums}
.gear{font-size:1.15rem;padding:4px 2px;opacity:.7}

.card{border-radius:16px;border:1px solid var(--edge);background:var(--card);position:relative;overflow:hidden}
.tint::before{content:"";position:absolute;inset:0;opacity:.14;background:currentColor;pointer-events:none}
.tint>*{position:relative}

/* now */
.hero{padding:15px 16px;margin-top:12px}
.hero .rw{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hero .ttl{font-size:1.4rem;font-weight:600;line-height:1.15;letter-spacing:-.02em;display:block;margin-top:5px}
.hero .sub{font-size:.82rem;color:var(--ink2);margin-top:5px;display:block;line-height:1.4}
.hero .left{flex:none;text-align:right;font-family:ui-monospace,Menlo,monospace;font-size:.66rem;
  letter-spacing:.06em;text-transform:uppercase;font-weight:700;font-variant-numeric:tabular-nums;padding-top:3px}
.hero .left u{text-decoration:none;display:block;color:var(--faint);font-size:.52rem;margin-top:3px}
.hero .nx{margin-top:12px;padding-top:10px;border-top:1px solid var(--edge2);display:flex;gap:9px;font-size:.76rem;color:var(--dim)}
.hero .nx b{flex:none;font-family:ui-monospace,Menlo,monospace;font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

.fb{margin-top:8px;padding:12px 14px;display:flex;align-items:center;gap:11px}
.fb.on{box-shadow:0 0 0 2px var(--hot)}
.fb .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}
.fb.on .dot{background:var(--hot);animation:pl 2.2s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
.fb .t{flex:1;min-width:0}
.fb .t b{display:block;font-size:.86rem;font-weight:600;line-height:1.25}
.fb .t i{font-style:normal;font-size:.68rem;color:var(--dim);font-variant-numeric:tabular-nums}
.btn{flex:none;border-radius:10px;padding:9px 14px;font-family:ui-monospace,Menlo,monospace;font-size:.58rem;
  letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:var(--hot);color:var(--bg);text-align:center}
.btn.gh{background:var(--sink);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--edge)}
.btn.wide{display:block;width:100%;padding:14px 0}

.sec{margin-top:22px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.sech span{font-size:.7rem;color:var(--faint)}

/* threads */
.tr{display:flex;align-items:stretch;margin-bottom:7px}
.tr.on{box-shadow:0 0 0 2px currentColor}
.trm{flex:1;min-width:0;padding:12px 6px 12px 14px;display:flex;flex-direction:column;gap:8px}
.trv{flex:none;width:54px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--edge2);font-size:1.15rem;opacity:.8}
.trh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding-right:9px}
.trh b{font-size:.86rem;font-weight:600;line-height:1.25}
.trh i{font-style:normal;flex:none;font-family:ui-monospace,Menlo,monospace;font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding-top:2px}
.pbar{height:5px;border-radius:3px;background:var(--sink);overflow:hidden;margin-right:9px}
.pbar i{display:block;height:100%;background:currentColor;border-radius:3px}
.trf{display:flex;justify-content:space-between;gap:10px;font-size:.67rem;color:var(--dim);padding-right:9px;font-variant-numeric:tabular-nums}
.trf em{font-style:normal;color:var(--faint);flex:none}

/* week */
.wk{display:flex;flex-direction:column;gap:5px}
.blk{border-radius:12px;padding:11px 13px;display:flex;gap:12px;border:1px solid var(--edge)}
.blk.now{box-shadow:0 0 0 2px currentColor}
.blk .tm{flex:none;width:4.3rem;font-family:ui-monospace,Menlo,monospace;font-size:.63rem;padding-top:2px;font-variant-numeric:tabular-nums;opacity:.9}
.blk b{display:block;font-size:.87rem;font-weight:600;line-height:1.25}
.blk i{font-style:normal;display:block;font-size:.72rem;margin-top:1px;opacity:.8;line-height:1.3}
.strip{display:flex;gap:4px;margin-bottom:9px}
.dbt{flex:1;min-width:0;border-radius:11px;padding:9px 2px;display:flex;justify-content:center;
  border:1px solid var(--edge);background:var(--card);font-family:ui-monospace,Menlo,monospace;
  font-size:.58rem;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:700}
.dbt[aria-pressed="true"]{background:var(--card2);box-shadow:0 0 0 2px var(--hot);color:var(--ink)}

/* compose */
.fld{margin-top:11px}
.fld label{display:block;margin-bottom:6px}
select,textarea,input[type=password],input[type=text]{width:100%;background:var(--sink);border:1px solid var(--edge);
  border-radius:12px;padding:12px 13px;font-size:.9rem;line-height:1.45;color:var(--ink)}
textarea{min-height:130px;resize:vertical;overflow-wrap:anywhere}
select{appearance:none}
.mic{display:flex;align-items:center;gap:11px;margin-top:11px}
.rec{flex:none;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;background:var(--sink);box-shadow:inset 0 0 0 1px var(--edge)}
.rec.on{background:var(--hot);color:var(--bg);animation:pl 1.4s infinite}
.mic .hint{flex:1;min-width:0;font-size:.72rem;color:var(--dim);line-height:1.35}
.lang{flex:none;border-radius:10px;padding:9px 11px;background:var(--sink);box-shadow:inset 0 0 0 1px var(--edge);
  font-family:ui-monospace,Menlo,monospace;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink2)}

/* inbox */
.iss{padding:13px 14px;margin-bottom:7px;display:block;width:100%}
.iss .top{display:flex;justify-content:space-between;gap:10px;font-family:ui-monospace,Menlo,monospace;
  font-size:.54rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.iss b{display:block;font-size:.88rem;font-weight:600;margin-top:5px;line-height:1.3}
.iss p{margin:5px 0 0;font-size:.76rem;color:var(--dim);line-height:1.4}
.iss .rep{margin-top:8px;padding:9px 10px;border-radius:9px;background:var(--sink);border-left:3px solid var(--hot);
  font-size:.78rem;color:var(--ink2);line-height:1.45}

/* map */
.align{padding:16px;margin-top:12px;text-align:center}
.align .pc{font-size:3.1rem;font-weight:600;letter-spacing:-.03em;line-height:1;display:block}
.align .cap{font-size:.78rem;color:var(--ink2);margin-top:7px;display:block;line-height:1.4}
.align .rail{height:7px;border-radius:4px;background:var(--sink);overflow:hidden;margin-top:13px;display:flex}
.align .rail i{display:block;height:100%}
.align .legend{display:flex;justify-content:center;gap:14px;margin-top:9px;font-size:.66rem;color:var(--dim)}
.align .legend span{display:flex;align-items:center;gap:5px}
.align .legend b{width:9px;height:9px;border-radius:3px;display:block}

.apex{margin-top:12px;padding:13px 15px;text-align:center}
.apex .lb{display:block;color:var(--faint);margin-bottom:5px}
.apex p{font-size:.9rem;line-height:1.45;color:var(--ink2);margin:0}

.goal{margin-bottom:8px;padding:14px 15px}
.goalh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.goalh b{font-size:.95rem;font-weight:600;line-height:1.25}
.goalh em{font-style:normal;flex:none;font-family:ui-monospace,Menlo,monospace;font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}
.goal .rail{height:6px;border-radius:3px;background:var(--sink);overflow:hidden;margin-top:9px}
.goal .rail i{display:block;height:100%;background:currentColor;border-radius:3px}
.feed{margin-top:11px;display:flex;flex-direction:column;gap:1px}
.fd{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--edge2);width:100%}
.fd .pip{flex:none;width:7px;height:7px;border-radius:50%;background:currentColor}
.fd .nm{flex:1;min-width:0;font-size:.8rem;line-height:1.3}
.fd .nm u{text-decoration:none;display:block;font-size:.68rem;color:var(--dim);margin-top:1px}
.fd .hr{flex:none;font-family:ui-monospace,Menlo,monospace;font-size:.66rem;color:var(--faint);font-variant-numeric:tabular-nums}
.fd.run .hr{color:var(--hot)}
.fd.cold .pip{background:var(--faint)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--edge);
  padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:34rem;margin:0 auto;display:flex}
nav button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim)}
nav button span{font-size:1.15rem;line-height:1}
nav button em{font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
nav button[aria-current="page"]{color:var(--hot)}

/* sheet */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:34rem;background:var(--card);border:1px solid var(--edge);border-bottom:none;
  border-radius:19px 19px 0 0;padding:16px 15px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:4px}
.sh .hd b{font-size:.95rem;font-weight:600;line-height:1.25}
.row{display:flex;gap:8px;margin-top:13px}
.row .btn{flex:1}

.note{font-size:.74rem;color:var(--faint);line-height:1.45;margin-top:10px}
.bad{color:var(--bad)}
.ok{color:var(--money)}
.empty{padding:26px 14px;text-align:center;color:var(--faint);font-size:.8rem;line-height:1.5}
.ol{margin:0;padding-left:1.1rem;font-size:.82rem;color:var(--ink2);line-height:1.6}
.ol li{margin-bottom:7px}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <h1 id="ttl">Now</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="clk" id="clk">—</span>
      <button class="gear" id="gear" aria-label="Settings">⚙</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav>
  <div class="in">
    <button data-v="now" aria-current="page"><span>◉</span><em>Now</em></button>
    <button data-v="map"><span>◈</span><em>Map</em></button>
    <button data-v="threads"><span>▤</span><em>Threads</em></button>
    <button data-v="say"><span>🎙</span><em>Say</em></button>
    <button data-v="inbox"><span>✉</span><em>Inbox</em></button>
  </div>
</nav>

<div id="sheet"></div>
<script src="app.js?v=4"></script>
</body>
</html>
