<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0F1013">
<title>Planner desktop</title>
<link rel="manifest" href="desktop.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
/* Three panes, not a wall of cards. Rail chooses a category, list chooses a
   thread, detail is the only place with text in it. Nothing is expanded that
   was not asked for. */
:root{
  --bg:#FBFAF8; --raise:#FFFFFF; --sink:#F1EFEA; --sink2:#E7E4DD;
  --ink:#14161A; --ink2:#5A6170; --dim:#8A909D; --hair:rgba(20,22,26,.10);
  --accent:#2F6BFF;
  --research:#2F6BFF; --patents:#7B4BD8; --teaching:#0E9C8A; --products:#E2731B;
  --people:#D93F73; --certs:#B98600; --conf:#5C6A80; --money:#12935A;
  --c1:#0E9C8A; --c2:#2A82C4; --c3:#4A5FCE; --neutral:#8A909D;
  --hot:#E2731B; --bad:#D53F3F; --good:#12935A;
  --head:52px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1013; --raise:#191B20; --sink:#15171C; --sink2:#22252C;
    --ink:#F2F3F6; --ink2:#A4ABB8; --dim:#767D8B; --hair:rgba(242,243,246,.12);
    --accent:#6E9CFF;
    --research:#6E9CFF; --patents:#A98AF0; --teaching:#2ABFA9; --products:#FF9445;
    --people:#F0709E; --certs:#E0B23F; --conf:#93A0B5; --money:#3CCA84;
    --c1:#2ABFA9; --c2:#5FAFE8; --c3:#8496F0; --neutral:#767D8B;
    --hot:#FF9445; --bad:#FF6B6B; --good:#3CCA84;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1013; --raise:#191B20; --sink:#15171C; --sink2:#22252C;
  --ink:#F2F3F6; --ink2:#A4ABB8; --dim:#767D8B; --hair:rgba(242,243,246,.12);
  --accent:#6E9CFF;
  --research:#6E9CFF; --patents:#A98AF0; --teaching:#2ABFA9; --products:#FF9445;
  --people:#F0709E; --certs:#E0B23F; --conf:#93A0B5; --money:#3CCA84;
  --c1:#2ABFA9; --c2:#5FAFE8; --c3:#8496F0; --neutral:#767D8B;
  --hot:#FF9445; --bad:#FF6B6B; --good:#3CCA84;
}

*{box-sizing:border-box}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:14.5px;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer;text-align:left;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrapall{overflow-wrap:anywhere;word-break:break-word}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---- header ---- */
header{height:var(--head);border-bottom:1px solid var(--hair);display:flex;align-items:center;
  gap:12px;padding:0 14px;background:var(--bg);position:sticky;top:0;z-index:40}
h1{margin:0;font-size:.98rem;font-weight:650;letter-spacing:-.01em;flex:none}
.state{flex:1;min-width:0;display:flex;gap:7px;align-items:center;font-size:.8rem;color:var(--dim)}
.state em{font-style:normal;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--good)} .dot.bad{background:var(--bad)} .dot.busy{background:var(--hot)}
.hbtn{flex:none;border:1px solid var(--hair);border-radius:8px;padding:5px 10px;font-size:.8rem;
  color:var(--ink2);background:var(--raise);white-space:nowrap}
.hbtn:hover{color:var(--ink);border-color:var(--ink2)}
.hbtn kbd{font-family:inherit;font-size:.72rem;color:var(--dim);margin-left:5px}

/* ---- shell ---- */
.shell{display:grid;grid-template-columns:238px 366px minmax(0,1fr);height:calc(100vh - var(--head));}
.pane{overflow-y:auto;overflow-x:hidden;min-width:0;border-right:1px solid var(--hair);padding:12px}
.pane:last-child{border-right:none}
.pane.detail{padding:18px 22px 60px;background:var(--raise)}
@media (max-width:1080px){
  .shell{grid-template-columns:210px minmax(0,1fr)}
  .pane.detail{display:none}
  body.detail-open .shell{grid-template-columns:210px minmax(0,1fr)}
  body.detail-open .pane.list{display:none}
  body.detail-open .pane.detail{display:block}
}
@media (max-width:720px){
  .shell{grid-template-columns:minmax(0,1fr);height:auto}
  .pane{height:auto;border-right:none;border-bottom:1px solid var(--hair)}
  body.detail-open .pane.rail{display:none}
}

/* ---- rail ---- */
.railh{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  font-weight:700;margin:14px 6px 6px}
.railh:first-child{margin-top:2px}
.ri{width:100%;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;
  font-size:.88rem;color:var(--ink2)}
.ri:hover{background:var(--sink)}
.ri[aria-current="true"]{background:var(--sink2);color:var(--ink);font-weight:600}
.ri .sw{width:9px;height:9px;border-radius:3px;flex:none;background:var(--a,var(--neutral))}
.ri .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .ct{flex:none;font-size:.76rem;color:var(--dim);font-variant-numeric:tabular-nums}
.ri .ct.live{color:var(--hot);font-weight:700}

/* ---- list ---- */
.lh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 4px 10px}
.lh h2{margin:0;font-size:.95rem;font-weight:650}
.lh span{font-size:.76rem;color:var(--dim)}
.li{width:100%;display:block;padding:9px 10px;border-radius:10px;border:1px solid transparent}
.li:hover{background:var(--sink)}
.li[aria-current="true"]{background:var(--sink);border-color:var(--hair)}
.li .t1{display:flex;gap:8px;align-items:baseline}
.li .t1 .sw{width:7px;height:7px;border-radius:50%;flex:none;background:var(--a,var(--neutral));transform:translateY(-1px)}
.li .t1 b{flex:1;min-width:0;font-size:.9rem;font-weight:600;line-height:1.3}
.li .t1 .rt{flex:none;font-size:.72rem;color:var(--dim);font-variant-numeric:tabular-nums}
.li .t2{margin-top:3px;padding-left:15px;font-size:.78rem;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.on{box-shadow:inset 2px 0 0 var(--hot)}
.pill{display:inline-block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
  font-weight:700;padding:2px 6px;border-radius:5px;background:var(--sink2);color:var(--ink2)}
.pill.unset{background:transparent;color:var(--hot);box-shadow:inset 0 0 0 1px var(--hot)}
.pill.live{background:var(--hot);color:#fff}

/* ---- detail ---- */
.dh{display:flex;gap:12px;align-items:flex-start;margin-bottom:4px}
.dh h2{margin:0;font-size:1.42rem;font-weight:650;letter-spacing:-.02em;line-height:1.2;flex:1;min-width:0}
.back{display:none;margin-bottom:10px;font-size:.82rem;color:var(--accent)}
@media (max-width:1080px){ .back{display:block} }
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 16px;font-size:.8rem;color:var(--dim)}
.sec{margin-top:22px}
.sec>h3{margin:0 0 9px;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{border:1px solid var(--hair);border-radius:20px;padding:6px 13px;font-size:.8rem;color:var(--ink2);background:var(--bg)}
.step:hover{border-color:var(--ink2);color:var(--ink)}
.step.at{background:var(--a,var(--accent));border-color:var(--a,var(--accent));color:#fff;font-weight:600}
.step.past{color:var(--dim);background:var(--sink)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--hair);border-radius:9px;padding:8px 14px;font-size:.82rem;font-weight:600;
  background:var(--bg);color:var(--ink2)}
.btn:hover{border-color:var(--ink2);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.stop{background:var(--hot);border-color:var(--hot);color:#fff}
.btn.warn:hover{border-color:var(--bad);color:var(--bad)}
.kv{font-size:.9rem;color:var(--ink2);line-height:1.55}
.kv b{color:var(--ink)}
.filelist{display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--hair);
  border-radius:9px;background:var(--bg);font-size:.84rem}
.file:hover{border-color:var(--ink2)}
.file .p{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
textarea,input[type=text],input[type=password],select{
  width:100%;background:var(--bg);border:1px solid var(--hair);border-radius:10px;
  padding:9px 11px;color:var(--ink);font-size:.88rem}
textarea{min-height:90px;resize:vertical;line-height:1.5}
textarea.code{min-height:52vh;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem;line-height:1.55}
.warnbar{margin:0 0 10px;padding:9px 11px;border-radius:9px;background:rgba(226,115,27,.12);
  color:var(--hot);font-size:.8rem;line-height:1.45}
.note{margin:8px 0 0;font-size:.8rem;color:var(--dim);line-height:1.45}
.note.ok{color:var(--good)} .note.bad{color:var(--bad)}
.cmt{padding:11px 0;border-top:1px solid var(--hair)}
.cmt:first-child{border-top:none}
.cmt .h{display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.cmt .h b{font-size:.86rem;font-weight:600}
.cmt .h span{flex:none;font-size:.74rem;color:var(--dim)}
.cmt p{margin:5px 0 0;font-size:.85rem;color:var(--ink2);line-height:1.5;white-space:pre-wrap}
.empty{font-size:.86rem;color:var(--dim);line-height:1.5}

/* today */
.now{border-left:3px solid var(--a,var(--accent));padding:2px 0 2px 13px;margin-bottom:14px}
.now .lb{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.now .bg{display:block;font-size:1.12rem;font-weight:650;line-height:1.25;margin-top:2px}
.now .sb{display:block;font-size:.8rem;color:var(--dim);margin-top:2px}
.tl{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.tb{display:flex;gap:10px;padding:8px 10px;border-radius:9px;background:var(--sink);
  border-left:3px solid var(--a,var(--neutral));font-size:.82rem}
.tb.now{box-shadow:0 0 0 2px var(--hot)}
.tb .tm{flex:none;width:5.3rem;color:var(--dim);font-variant-numeric:tabular-nums;font-size:.78rem}
.tb .bb{flex:1;min-width:0}
.tb .bb b{display:block;font-weight:600;line-height:1.25}
.tb .bb i{font-style:normal;display:block;font-size:.75rem;color:var(--dim)}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.mc{border:1px solid var(--hair);border-radius:11px;padding:9px 11px;background:var(--bg)}
.mc b{display:block;font-size:1.28rem;font-weight:650;line-height:1.15}
.mc span{display:block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.wkgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:1180px){ .wkgrid{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:700px){ .wkgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.dcol{min-width:0;display:flex;flex-direction:column;gap:5px}
.dhh{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;
  padding-bottom:3px;border-bottom:1px solid var(--hair)}
.dhh.today{color:var(--accent)}

/* palette */
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;
  align-items:flex-start;justify-content:center;padding:9vh 16px 16px}
.modal .cd{width:100%;max-width:34rem;max-height:76vh;overflow-y:auto;background:var(--raise);
  border:1px solid var(--hair);border-radius:14px;padding:14px}
.modal h3{margin:0 0 11px;font-size:.95rem}
.pl{width:100%;display:flex;gap:9px;align-items:center;padding:9px 10px;border-radius:9px;font-size:.88rem}
.pl:hover,.pl.sel{background:var(--sink)}
.pl .sw{width:7px;height:7px;border-radius:50%;background:var(--a,var(--neutral));flex:none}
.pl .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .hint{flex:none;font-size:.72rem;color:var(--dim)}
</style>
</head>
<body>

<header>
  <h1>Planner</h1>
  <div class="state"><span class="dot" id="dot"></span><em id="stateTxt">Starting…</em></div>
  <button class="hbtn" id="palette">Search<kbd>⌘K</kbd></button>
  <button class="hbtn" id="refresh">Refresh</button>
  <button class="hbtn" id="theme" aria-label="Switch light and dark">◐</button>
  <button class="hbtn" id="gear">Settings</button>
</header>

<div class="shell">
  <nav class="pane rail" id="rail"></nav>
  <div class="pane list" id="list"></div>
  <div class="pane detail" id="detail"></div>
</div>

<div id="modal"></div>
<script src="desktop.js?v=2"></script>
</body>
</html>
